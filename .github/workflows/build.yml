name: Build ImmortalWrt 24.10.6 (QModem stable, legacy UI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt tag to build"
        required: true
        default: "v24.10.6"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      IWRT_VERSION: ${{ github.event.inputs.version || 'v24.10.6' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt-get clean
          df -h /

      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pip \
            rsync unzip zlib1g-dev file wget dwarves libelf-dev bc ccache \
            libtool automake autoconf pkg-config zstd cpio xxd
          clang --version | head -1
          for t in llvm-strip opt llvm-dis llc; do
            if ! command -v "$t" >/dev/null; then
              src=$(ls /usr/lib/llvm-*/bin/"$t" 2>/dev/null | sort -V | tail -1)
              [ -n "$src" ] && sudo ln -sf "$src" /usr/local/bin/"$t"
            fi
            command -v "$t"
          done
          df -h /

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('.config', 'feeds.conf.default') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 --branch "$IWRT_VERSION" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git describe --tags

      - name: Configure feeds
        run: |
          cp feeds.conf.default openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig
          grep -E 'CONFIG_PACKAGE_(qmodem|luci-app-qmodem|luci-app-qmodem-sms|sms-forwarder|tom_modem|daed)=' .config

      - name: Download sources
        run: |
          cd openwrt
          make -j"$(nproc)" download || make -j1 V=s download

      - name: Build firmware
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp openwrt/bin/targets/x86/64/*combined-efi.img.gz artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*.sha256sums artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/sha256sums artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*.manifest artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/config.buildinfo artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/version.buildinfo artifacts/ 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          if [ -d openwrt/logs ]; then
            mkdir -p artifacts/logs
            cp -r openwrt/logs/. artifacts/logs/ || true
          fi
          ls -lh artifacts

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          [ -f sha256sums ] || sha256sum *.img.gz > sha256sums
          TAG="${IWRT_VERSION}-qmodem-legacy-r${{ github.run_number }}"
          cat > release-notes.md <<EOF
          ## ImmortalWrt ${IWRT_VERSION} + QModem stable v3.3.0（旧版 Lua 界面）

          - 构建记录：[run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - 提交：\`${{ github.sha }}\`
          - 镜像：\`ext4-combined-efi\`（EFI/BIOS 混合启动），内核分区 32 MiB，根分区 1024 MiB
          - 组件：QModem 3.3.0（\`luci-app-qmodem\` + \`luci-app-qmodem-sms\` + \`sms-forwarder\`）、daed 1.24.0、dockerman 0.5.26（Lua）、samba4、frpc、Argon 主题
          - 校验：见 \`sha256sums\`

          > 本固件配置、工作流与文档由 AI（Qoder）生成，未在所有硬件组合上实机验证。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" immortalwrt-*.img.gz sha256sums *.manifest config.buildinfo version.buildinfo build.log --clobber
          else
            gh release create "$TAG" immortalwrt-*.img.gz sha256sums *.manifest config.buildinfo version.buildinfo build.log \
              --title "ImmortalWrt ${IWRT_VERSION} + QModem 3.3.0 (legacy UI) - r${{ github.run_number }}" \
              --notes-file release-notes.md --latest
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immortalwrt-${{ env.IWRT_VERSION }}-qmodem-legacy-efi
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
